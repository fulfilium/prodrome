[package]
name = "prodrome-core"
description = "A temporal, content-addressed event database with fulfillment-priority semantics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["event-sourcing", "content-addressed", "database", "temporal", "fuzzy-logic"]
categories = ["database-implementations", "data-structures", "date-and-time"]
# One integration-test binary, `tests/all/`, instead of one per file.
autotests = false

[features]
# THE REFERENCE PAYLOAD, on by default. `prodrome::reference` is the record
# shape `conformance/*.json` was taken with and the worked example of
# `payload::Payload`; the crate's own conformance suites are written against
# it, which is why it ships rather than living in `tests/`. A host that
# defines its own payload and wants none of these types compiles with
# `default-features = false`.
default = ["reference", "laws"]
reference = []
# THE LAW KIT, on by default. `prodrome::laws` holds the laws of SPEC §9 that
# ask nothing of a schema, as functions over a store's objects, an event or
# two replicas. The crate's own tests run them over the reference schemas.
# A host that turns the default features off enables it for its own tests,
# to check its schemas with the same laws.
laws = []

[lib]
name = "prodrome"
path = "src/lib.rs"

[[test]]
name = "all"
path = "tests/all/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# SPEC §3's `Signed`: Ed25519, pure Rust, so the browser's build needs no C
# toolchain, and over the same `sha2` the names are. No `rand_core`: a key
# is a seed the host draws and keeps (design §6.4), never one drawn here.
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
sha2 = "0.10"
thiserror = "2"
# `str.isprintable`'s Unicode categories, which the string printer needs to
# reproduce CPython's `repr` byte for byte (SPEC section 2). Data tables only.
unicode-general-category = "1"

# THE STORE'S LOCK, ON UNIX ONLY. `EventStore::append` takes an exclusive
# `flock` on `root/.lock` — the same file and the same operation the earlier
# Python writer took (the reference's `store.py::_flock`), so two writers of
# one store serialise whatever language each is in. Target-gated because
# `prodrome-wasm` compiles this crate for `wasm32-unknown-unknown`, which has no
# filesystem to lock and whose `errno` will not build.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
proptest = "1"
