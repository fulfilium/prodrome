[package]
name = "prodrome-core"
description = "A temporal, content-addressed event database with fulfillment-priority semantics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["event-sourcing", "content-addressed", "database", "temporal", "fuzzy-logic"]
categories = ["database-implementations", "data-structures", "date-and-time"]
# One integration-test binary, `tests/all/`, instead of one per file.
autotests = false

[features]
# THE REFERENCE PAYLOAD, on by default. `prodrome::reference` is the record
# shape `conformance/*.json` was taken with and the worked example of
# `payload::Payload`; the crate's own conformance suites are written against
# it, which is why it ships rather than living in `tests/`. A host that
# defines its own payload and wants none of these types compiles with
# `default-features = false`.
default = ["reference"]
reference = ["prodrome-todo/reference"]
# THE LAW KIT, off by default. `prodrome::laws` holds the laws of SPEC §9 that
# ask nothing of a schema, as functions over a store's objects, an event or
# replicas, with proptest strategies to drive them. A host enables it for its
# tests (`[dev-dependencies]`), to check its schemas with the same laws. The
# crate's own tests enable it through the dev-dependency on this crate below.
laws = ["dep:proptest"]

[lib]
name = "prodrome"
path = "src/lib.rs"

[[test]]
name = "all"
path = "tests/all/main.rs"

[dependencies]
# The law kit's strategies, with the `laws` feature only.
proptest = { version = "1", optional = true }
# The data of a store, which this crate re-exports at the paths that a
# program names: `prodrome::event`, `prodrome::literal` and the others.
prodrome-data.workspace = true
# The caches, which this crate re-exports as `prodrome::memo`.
prodrome-memo.workspace = true
# The DAG, the fold of its objects, the policies and the proof of
# signatures, which this crate re-exports at `prodrome::dag` and the other
# paths that a program names.
prodrome-dag.workspace = true
# Schemas declared as text, which this crate re-exports as
# `prodrome::declared`.
prodrome-declared.workspace = true
# The summary tree, which this crate re-exports as `prodrome::digest`.
prodrome-digest.workspace = true
# Histories held in registers, which this crate re-exports as
# `prodrome::nest`.
prodrome-nest.workspace = true
# The store and the attestation of a snapshot, which this crate re-exports
# at `prodrome::store` and `prodrome::snapshot`.
prodrome-store.workspace = true
# Mergeable tag sets, which this crate re-exports as `prodrome::tags`.
prodrome-tags.workspace = true
# The terms of FPL, which this crate re-exports at `prodrome::term`,
# `prodrome::schedule` and `prodrome::fpl`.
prodrome-term.workspace = true
# The evaluator, which this crate re-exports at `prodrome::fpl`,
# `prodrome::chain`, `prodrome::breaks` and `prodrome::observe`.
prodrome-fpl.workspace = true
# The todo schema's events and payload, which this crate re-exports at
# `prodrome::event`, `prodrome::payload` and `prodrome::reference`.
prodrome-todo.workspace = true
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
# The tests build instants and spans.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
proptest = "1"
# This crate with the law kit, so its own tests run the kit over the
# reference schemas: a package may name itself as a dev-dependency to turn on
# a feature for its tests.
prodrome-core = { path = ".", features = ["laws"] }
# The tests compare the printable set of SPEC section 2, which is a table in
# this crate, with the General_Category data of Unicode 16.0.0 that version
# 1.1.0 of this dependency holds. The version is exact: a version with the
# data of another Unicode version fails the test, and the test names each
# code point that differs.
unicode-general-category = "=1.1.0"
