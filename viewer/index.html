<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Scripts come from this site only, and never inline: typeset HTML is put
     in the page, so an inline handler that slipped past the sanitiser still
     would not run. Typst's inline SVG needs inline styles. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="The Prodrome's roadmap, folded and typeset in the browser.">
<title>Prodrome</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=__BUILD__">
<script type="module" src="app.js?v=__BUILD__"></script>
</head>
<body data-state="loading">
<header>
  <a class="home" href="#/">Prodrome</a>
  <span id="status" role="status" aria-live="polite">loading…</span>
</header>
<main id="page"><noscript>This viewer folds the roadmap in your browser, so it needs JavaScript and WebAssembly.</noscript></main>
<footer>
  A read-only viewer of <a href="https://github.com/fulfilium/prodrome">prodrome</a>'s
  roadmap: the objects on the <code>roadmap-data</code> branch, folded and priced
  by the core compiled to WebAssembly, typeset by Typst compiled to WebAssembly.
  An example of a host, not part of the core. Fonts: Libertinus and Source Serif,
  <a href="fonts/README.md">SIL Open Font License</a>.
</footer>
</body>
</html>
